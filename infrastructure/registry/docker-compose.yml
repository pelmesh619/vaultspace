name: vaultspace-registry

services:
  registry:
    image: registry:3.1.2
    restart: unless-stopped
    ports:
      - "${REGISTRY_BIND_IP:-0.0.0.0}:${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  registry-data:
